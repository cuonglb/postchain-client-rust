[package]
name = "postchain-client"
version = "0.0.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Just another Chromia Postchain client implemented in Rust."
readme = "README.md"
repository = "https://github.com/cuonglb/postchain-client-rust/"
exclude = [
    "examples/*",
]

[dependencies]
postchain-client-derive = { path = "derive", version = "0.0.1" }
openssl = "0.10.73"
ring = "0.17.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
reqwest = { version = "0.12.24", features = ["json"] } 
url = "2.5.7"
tokio = { version = "1.47.1", features = ["full"] }
asn1 = {version = "0.23.0", features = ["std"] }
secp256k1 = { version = "0.31.1", features = ["rand", "serde"] }
hex = "0.4.3"
num-bigint = "0.4.6"
sha2 = "0.10.9"
tracing = "0.1.41"
base64 = "0.22"
bigdecimal = { version = "0.4.8", features = [ "serde-json" ] }
sfv = "0.14.0"

[dev-dependencies]
openssl = "0.10.73"
ring = "0.17.13"
rand = "0.9.2"
tracing-subscriber = "0.3.20"
ctor = "0.6.0"
