[package]
name = "postchain-client"
version = "0.0.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Just another Chromia Postchain client implemented in Rust."
readme = "README.md"
repository = "https://github.com/cuonglb/postchain-client-rust/"
exclude = [
    "examples/*",
]

[dependencies]
postchain-client-derive = { path = "derive", version = "0.0.1" }
openssl = "0.10.80"
ring = "0.17.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
reqwest = { version = "0.13.3", features = ["json"] } 
url = "2.5.8"
tokio = { version = "1.50.0", features = ["full"] }
asn1 = {version = "0.24.1", features = ["std"] }
secp256k1 = { version = "0.31.1", features = ["rand", "serde"] }
hex = "0.4.3"
num-bigint = "0.4.6"
sha2 = "0.11.0"
tracing = "0.1.44"
base64 = "0.22"
bigdecimal = { version = "0.4.10", features = [ "serde-json" ] }
sfv = "0.14.0"

[dev-dependencies]
openssl = "0.10.80"
ring = "0.17.13"
rand = "0.10.0"
tracing-subscriber = "0.3.23"
ctor = "1.0.6"
